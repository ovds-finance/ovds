##############################################################################
# docker-compose.scale.yml
#
# Distributed scale stack for OVDS at 12M+ users.
# Run with: docker compose -f docker-compose.scale.yml up
#
# Topology:
#   nginx (load balancer)
#     └─ backend × 4 (NestJS instances — stateless, share Redis + DB)
#   redis (cache + queue broker)
#     └─ redis-replica (read replica — optional, used by cache reads)
#   mysql (primary)
#     └─ mysql-replica (read replica — queries routed via ProxySQL in prod)
##############################################################################

services:
  # ── Load Balancer ────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/public:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

  # ── Backend (run 4 replicas) ─────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    deploy:
      replicas: 4
    environment:
      NODE_ENV: production
      PRISMA_DATABASE_URL: ${PRISMA_DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      DB_CONNECTION_LIMIT: 5
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Redis (cache + BullMQ broker) ────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis replica (read-only, optional) ──────────────────────────────────────
  redis-replica:
    image: redis:7.4-alpine
    command: redis-server --replicaof redis 6379 --maxmemory 512mb --maxmemory-policy allkeys-lru
    depends_on:
      - redis
    restart: unless-stopped

  # ── MySQL Primary ────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    environment:
      # ⚠️  PRODUCTION: provide a strong MYSQL_ROOT_PASSWORD in your .env file.
      #     The :-fallback is intentionally absent — deployment must fail if unset.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ovds}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  redis_data:
  mysql_data:
