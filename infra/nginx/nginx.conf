##############################################################################
# infra/nginx/nginx.conf
#
# Production-grade Nginx reverse proxy for OVDS.
#
# Security hardening (2026 edition):
#  - TLS 1.3 only on port 443; port 80 permanently redirects to HTTPS
#  - server_tokens off + custom Server header suppression (no version leakage)
#  - X-Powered-By and other fingerprinting headers removed at edge
#  - Separate rate-limit zones for abuse detection:
#      * api_ratelimit  : general API traffic
#      * error_404      : 404-storm detection (scanner/probe mitigation)
#      * login_zone     : brute-force on auth endpoints
#      * bot_zone       : headless/scraper UA blocking before they hit app
#  - Anti-mirroring: block known headless browser & scraper User-Agents
#  - HSTS with preload on all responses
#  - Full CSP, X-Frame-Options, Referrer-Policy at edge (belt-and-suspenders)
#  - Least-conn upstream with health checks and keepalive
##############################################################################

worker_processes  auto;
worker_rlimit_nofile 65535;

events {
    worker_connections  10240;
    use                 epoll;
    multi_accept        on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ── Silence version information ──────────────────────────────────────────
    server_tokens off;

    # ── Performance tweaks ──────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   75s;
    keepalive_requests  1000;

    # ── Structured access log ────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time '
                      'x_req_id=$http_x_request_id co=$http_x_company_id';

    access_log  /var/log/nginx/access.log  main  buffer=64k  flush=5s;
    error_log   /var/log/nginx/error.log   warn;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 4;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml;

    # ── Rate-limit zones ─────────────────────────────────────────────────────
    # General API: 200 req/s with burst 500
    limit_req_zone  $binary_remote_addr zone=api_ratelimit:20m  rate=200r/s;

    # Auth endpoints: 10 req/min per IP — brute-force mitigation
    limit_req_zone  $binary_remote_addr zone=login_zone:10m     rate=10r/m;

    # Aggressive 404 probing: if an IP triggers >30 404s/min it is rate-limited
    # The StatusCodeAbuseGuard in NestJS returns 444 for blocked IPs so that
    # nginx drops the connection without a response body.
    limit_req_zone  $binary_remote_addr zone=error_404:5m       rate=30r/m;

    # Bot/scraper zone: very tight — 5 req/s for suspicious UAs
    limit_req_zone  $binary_remote_addr zone=bot_zone:5m        rate=5r/s;

    # Per-IP concurrent connection cap
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Return 429 (not the default 503) for throttled requests
    limit_req_status  429;
    limit_conn_status 429;

    # ── Backend upstream pool ────────────────────────────────────────────────
    upstream backend_pool {
        least_conn;
        server backend:3001 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # ── Map headless/scraper User-Agents to a flag ───────────────────────────
    # Extend this list with fresh signatures from threat-intel feeds.
    map $http_user_agent $is_bot {
        default                         0;
        "~*HeadlessChrome"              1;
        "~*PhantomJS"                   1;
        "~*Puppeteer"                   1;
        "~*Playwright"                  1;
        "~*python-requests"             1;
        "~*Go-http-client"              1;
        "~*curl/"                       1;
        "~*wget/"                       1;
        "~*libwww-perl"                 1;
        "~*scrapy"                      1;
        "~*sqlmap"                      1;
        "~*nikto"                       1;
        "~*masscan"                     1;
        "~*zgrab"                       1;
        "~*nmap"                        1;
        ""                              1;  # empty UA always suspicious
    }

    # ── HTTP → HTTPS redirect (port 80) ─────────────────────────────────────
    server {
        listen      80;
        server_name _;

        # ACME challenge pass-through (Let's Encrypt / Certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server (port 443) ──────────────────────────────────────────────
    server {
        listen      443 ssl;
        http2       on;
        server_name _;

        # ── TLS: 1.3 only with PFS cipher suites ────────────────────────────
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols             TLSv1.3;
        ssl_prefer_server_ciphers off;         # TLS 1.3 handles its own ordering
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;         # forward secrecy: no session ticket reuse

        # OCSP stapling — reduces TLS handshake RTT by one round trip
        ssl_stapling        on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/nginx/ssl/chain.pem;
        resolver            8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout    5s;

        # ── Security headers (edge layer — mirrors NestJS Helmet) ────────────
        # HSTS: 2 years, all subdomains, submit for browser preload list
        add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options            "DENY"                                         always;
        add_header X-Content-Type-Options     "nosniff"                                      always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
        add_header X-XSS-Protection           "1; mode=block"                                always;
        add_header Cross-Origin-Opener-Policy "same-origin"                                  always;
        add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        # Frame-ancestors belt-and-suspenders (CSP directive)
        add_header Content-Security-Policy    "frame-ancestors 'none'"                       always;

        # Suppress server identity from upstream
        proxy_hide_header  X-Powered-By;
        proxy_hide_header  Server;
        more_clear_headers Server;   # requires headers-more-nginx-module; safe no-op if absent

        # ── Request size limits ──────────────────────────────────────────────
        client_max_body_size    10m;
        client_body_timeout     30s;
        client_header_timeout   15s;
        send_timeout            30s;

        # ── Bot / headless UA blocking ───────────────────────────────────────
        # Requests from known scrapers and headless browsers are rate-limited
        # tightly and responded to with 429 before they hit application code.
        location ~* ^/api/ {
            if ($is_bot) {
                limit_req zone=bot_zone burst=10 nodelay;
            }

            limit_req  zone=api_ratelimit burst=500 nodelay;
            limit_conn addr 100;

            proxy_pass          http://backend_pool;
            proxy_http_version  1.1;
            proxy_set_header    Connection        "";
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;

            proxy_connect_timeout  5s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;

            proxy_buffering    on;
            proxy_buffer_size  8k;
            proxy_buffers      16 8k;
        }

        # ── Auth endpoints — tighter brute-force throttle ────────────────────
        location ~* ^/api/auth/(login|register|forgot-password) {
            limit_req  zone=login_zone burst=5 nodelay;
            limit_conn addr 20;

            proxy_pass          http://backend_pool;
            proxy_http_version  1.1;
            proxy_set_header    Connection        "";
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ── WebSocket proxy ──────────────────────────────────────────────────
        location /socket.io/ {
            limit_req  zone=api_ratelimit burst=50 nodelay;
            limit_conn addr 20;

            proxy_pass          http://backend_pool;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_set_header    Host       $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_read_timeout  3600s;
        }

        # ── Static assets — 1-year immutable cache ───────────────────────────
        location ~* \.(js|css|woff2?|png|jpg|svg|ico|webp)$ {
            root       /usr/share/nginx/html;
            expires    1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files  $uri =404;
        }

        # ── SPA fallback ─────────────────────────────────────────────────────
        location / {
            root       /usr/share/nginx/html;
            try_files  $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # ── Block directory traversal in URI ────────────────────────────────
        location ~* "\.\." {
            return 400;
        }

        # ── Custom error pages — never leak Nginx version ────────────────────
        error_page 404 /404.html;
        error_page 429 /429.html;
        error_page 500 502 503 504 /50x.html;

        location = /404.html { root /usr/share/nginx/html; internal; }
        location = /429.html { root /usr/share/nginx/html; internal; }
        location = /50x.html { root /usr/share/nginx/html; internal; }
    }
}
