##############################################################################
# infra/nginx/nginx.conf
#
# Nginx reverse proxy + load balancer for OVDS at 12M+ users.
#
# Key decisions:
#  - least_conn   : routes new requests to the backend with fewest active connections
#                   better than round-robin for variable-latency API calls
#  - keepalive 64 : persistent upstream connections, avoids TCP handshake overhead
#  - gzip on      : compress API JSON at the edge (backup to backend compression)
#  - Cache static : 1-year immutable caching for hashed frontend assets
##############################################################################

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 10240;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ── Performance tweaks ──────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75s;
    keepalive_requests 1000;

    # ── Access log format — structured for log aggregators ──────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time '
                      'x_req_id=$http_x_request_id co=$http_x_company_id';

    access_log  /var/log/nginx/access.log  main  buffer=64k  flush=5s;
    error_log   /var/log/nginx/error.log   warn;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml;

    # ── Rate limiting (DDoS / abuse protection) ──────────────────────────────
    # 200 req/s per IP — allows bursts up to 500
    limit_req_zone  $binary_remote_addr zone=api:20m rate=200r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ── Backend upstream pool ────────────────────────────────────────────────
    upstream backend_pool {
        least_conn;
        server backend:3001 max_fails=3 fail_timeout=10s;
        keepalive 64;         # persistent connections to backend instances
    }

    server {
        listen 80;
        server_name _;

        # ── Security headers (mirrors Helmet in NestJS) ──────────────────────
        add_header X-Frame-Options          "DENY"            always;
        add_header X-Content-Type-Options   "nosniff"         always;
        add_header Referrer-Policy          "same-origin"     always;
        add_header X-XSS-Protection         "1; mode=block"   always;

        # Hide nginx version from error pages and Server header
        server_tokens off;

        # Prevent clickjacking on all responses (belt-and-suspenders with app layer)
        add_header Content-Security-Policy  "frame-ancestors 'none'" always;

        # ── Request size limits (DoS protection) ─────────────────────────────
        # Matches MAX_REQUEST_SIZE=10mb in the NestJS backend.
        # Nginx rejects oversized payloads before they reach the app server.
        client_max_body_size 10m;
        client_body_timeout  30s;
        client_header_timeout 15s;

        # ── Slow-client/connection flood mitigation ───────────────────────────
        send_timeout 30s;

        # ── API proxy ────────────────────────────────────────────────────────
        location /api/ {
            limit_req  zone=api burst=500 nodelay;
            limit_conn addr 100;

            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout  5s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;

            # Buffer tuning — keep small so streaming responses work
            proxy_buffering         on;
            proxy_buffer_size       8k;
            proxy_buffers           16 8k;
        }

        # ── WebSocket proxy ──────────────────────────────────────────────────
        location /socket.io/ {
            # Rate-limit WS upgrade handshakes — prevents connection-flood DoS.
            # Each client polls first (transports: polling), so this catches abuse.
            limit_req  zone=api burst=50 nodelay;
            limit_conn addr 20;

            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # ── Static frontend assets — 1-year immutable ────────────────────────
        location ~* \.(js|css|woff2?|png|jpg|svg|ico|webp)$ {
            root   /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;  # suppress high-frequency static asset hits
            try_files $uri =404;
        }

        # ── SPA fallback ─────────────────────────────────────────────────────
        location / {
            root       /usr/share/nginx/html;
            try_files  $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
