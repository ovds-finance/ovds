services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ovds}
      MYSQL_USER: ${MYSQL_USER:-ovds}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-ovds}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./packages/database/migrations/ovds_audit_chain.sql:/docker-entrypoint-initdb.d/01-ovds-audit-chain.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/mysqld
    networks:
      - ovds-backend
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 512M
          cpus: '0.5'

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: always
    ports:
      - "3001:3001"
    environment:
      PRISMA_DATABASE_URL: mysql://${MYSQL_USER:-ovds}:${MYSQL_PASSWORD:-change-me-ovds}@mysql:3306/${MYSQL_DATABASE:-ovds}
      SYNC_CLOUD_URL: http://backend:3001
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
    networks:
      - ovds-backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: always
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - ovds-frontend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

networks:
  ovds-backend:
    driver: bridge
    internal: false
  ovds-frontend:
    driver: bridge

volumes:
  mysql_data:
    driver: local
