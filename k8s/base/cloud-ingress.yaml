apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-ingress
  namespace: ovds
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.ovds.cloud
        - "*.ovds.cloud"
      secretName: ovds-tls
  rules:
    - host: api.ovds.cloud
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cloud-api
                port:
                  number: 80
    - host: "*.ovds.cloud"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80