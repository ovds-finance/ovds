apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: ovds
  labels:
    app: portal
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
        component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: portal
          image: ovds/portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: ovds-config
                  key: database-provider
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ovds-secrets
                  key: database-url
            - name: PORT
              value: "4000"
            - name: TENANT_ROUTING_MODE
              value: "path"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ovds-secrets
                  key: jwt-secret
            - name: LICENSE_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: ovds-secrets
                  key: license-passphrase
            - name: LICENSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: ovds-secrets
                  key: license-public-key
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: portal-data-pvc