apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/namespace.yaml
  - ../../base/secrets.yaml
  - ../../base/rbac.yaml
  - configmap.yaml
  - portal-pvc.yaml
  - portal-deployment.yaml
  - portal-service.yaml
  - onpremise-ingress.yaml

commonLabels:
  app.kubernetes.io/name: ovds
  app.kubernetes.io/part-of: ovds-onpremise

patches:
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: ovds
        labels:
          environment: onpremise
    target:
      kind: Namespace