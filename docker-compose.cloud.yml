##############################################################################
# docker-compose.cloud.yml — OVDS Cloud SaaS deployment
#
# SECURITY REQUIREMENTS before running in production:
#  1. Create a .env file (never commit it) with at minimum:
#       POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
#       JWT_SECRET (≥32 random chars),  JWT_REFRESH_SECRET (≥32 random chars)
#       REDIS_PASSWORD (≥24 random chars)
#       OFFLINE_PUBLIC_KEY
#  2. Generate strong secrets:
#       openssl rand -hex 32   # for JWT_SECRET and JWT_REFRESH_SECRET
#       openssl rand -hex 24   # for REDIS_PASSWORD
#  3. Bind only the API port (3000) to the host. DB and Redis must remain on
#     the internal Docker network — never expose 5432 or 6379 to the host.
##############################################################################
version: '3.8'

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  cloud-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       "${POSTGRES_DB:-ovds_cloud}"
      POSTGRES_USER:     "${POSTGRES_USER:-ovds_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"        # required — no default
    volumes:
      - cloud_pg_data:/var/lib/postgresql/data
    # NO host port binding — postgres is only reachable inside the Docker network.
    # Remove the ports section entirely; add it back only for local debugging
    # behind a firewall, e.g.:   ports: [ "127.0.0.1:5432:5432" ]
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ovds_user} -d ${POSTGRES_DB:-ovds_cloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  # ── Redis ───────────────────────────────────────────────────────────────────
  cloud-redis:
    image: redis:7-alpine
    # Require password authentication — set REDIS_PASSWORD in your .env file.
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # ── NestJS API ──────────────────────────────────────────────────────────────
  cloud-api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_PROVIDER:    "postgresql"
      # Compose variable substitution — values come from host .env, never hardcoded.
      DATABASE_URL:         "postgresql://${POSTGRES_USER:-ovds_user}:${POSTGRES_PASSWORD}@cloud-postgres:5432/${POSTGRES_DB:-ovds_cloud}"
      PRISMA_DATABASE_URL:  "postgresql://${POSTGRES_USER:-ovds_user}:${POSTGRES_PASSWORD}@cloud-postgres:5432/${POSTGRES_DB:-ovds_cloud}"
      DEPLOYMENT_MODE:      "CLOUD_SAAS"
      NODE_ENV:             "production"
      REDIS_ENABLED:        "true"
      REDIS_HOST:           "cloud-redis"
      REDIS_PORT:           "6379"
      REDIS_PASSWORD:       "${REDIS_PASSWORD}"
      JWT_SECRET:           "${JWT_SECRET}"
      JWT_REFRESH_SECRET:   "${JWT_REFRESH_SECRET}"
      OFFLINE_PUBLIC_KEY: "${OFFLINE_PUBLIC_KEY}"
      # Security — never expose internal details in production
      SHOW_ERROR_DETAILS:   "false"
      ENABLE_SWAGGER:       "false"
      # Forward FRONTEND_URL for CORS (set in .env to your production domain)
      CORS_ORIGIN:          "${CORS_ORIGIN}"
    ports:
      # Expose API port only; bind to 0.0.0.0 so the reverse proxy can reach it.
      # Put Nginx or Cloudflare in front — never expose this directly to the internet.
      - "3000:3001"
    depends_on:
      cloud-postgres:
        condition: service_healthy
      cloud-redis:
        condition: service_healthy
    volumes:
      - ./apps/backend/prisma/migrations:/app/prisma/migrations:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  cloud_pg_data:
    driver: local
