name: Docs Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'packages/database/prisma/schema.prisma'
      - 'scripts/generate-schema-docs.mjs'
      - 'scripts/seed-docs.mjs'
      - 'scripts/check-docs-health.mjs'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'packages/database/prisma/schema.prisma'
      - 'scripts/generate-schema-docs.mjs'
      - 'scripts/seed-docs.mjs'
      - 'scripts/check-docs-health.mjs'
  workflow_dispatch:

jobs:
  docs-validate:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gate 1: the generated DATA-MODEL.md must match the current Prisma schema.
      - name: Check generated data model is fresh
        run: node scripts/generate-schema-docs.mjs --check

      # Gate 2: report broken internal links / orphan references in docs/.
      # Soft gate (--warn) — pre-existing doc debt is surfaced without failing CI;
      # the schema freshness gate above is the hard contract.
      - name: Check docs link health
        run: node scripts/check-docs-health.mjs --warn

  docs-seed:
    name: Seed Docs Portal
    runs-on: ubuntu-latest
    needs: docs-validate
    # Seeding writes to the doc_article table and needs a live MariaDB.
    # Allow it to fail when DB infra is absent so the validate gate still protects quality.
    continue-on-error: true
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ovds
          MARIADB_DATABASE: ovds
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_init=on --su=root --password=ovds"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      PRISMA_DATABASE_URL: mysql://root:ovds@127.0.0.1:3306/ovds
      JWT_SECRET: ci-secret
      REFRESH_TOKEN_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate:prod

      - name: Seed docs portal
        run: npm run docs:seed
