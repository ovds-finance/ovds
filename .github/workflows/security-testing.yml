name: Security Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  security-check:
    name: Security Configuration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate ZAP Configuration
        run: node scripts/validate-zap-config.mjs

      - name: Check for Secrets
        run: bash scripts/scan-secrets.sh

      - name: Check Dependencies
        run: bash scripts/check-dependencies.sh

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: security-check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start application
        run: npm run dev:backend &
        env:
          NODE_ENV: development
          PORT: 3001

      - name: Wait for application
        run: npx wait-on http://localhost:3001/health/live --timeout 60000

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3001'
          rules_version_id: '0.50.0'
          fail_action: true
          fail_threshold: medium

      - name: Run ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.11.0
        with:
          target: 'http://localhost:3001'
          rules_version_id: '0.50.0'
          fail_action: true
          fail_threshold: medium

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@v3.63.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for outdated dependencies
        run: npm outdated || true

  security-report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [security-scan, secret-scan, dependency-check]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Generate Security Report
        run: bash scripts/generate-security-report.sh

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security-reports/
          retention-days: 30

      - name: Send Security Alert
        if: failure()
        run: bash scripts/security-alert.sh
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [security-scan, secret-scan, dependency-check]
    if: always()
    steps:
      - name: Check Security Results
        run: |
          if [ "${{ needs.security-scan.result }}" == "failure" ]; then
            echo "ZAP security scan failed"
            exit 1
          fi
          if [ "${{ needs.secret-scan.result }}" == "failure" ]; then
            echo "Secret scan failed"
            exit 1
          fi
          if [ "${{ needs.dependency-check.result }}" == "failure" ]; then
            echo "Dependency check failed"
            exit 1
          fi
          echo "All security checks passed"

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ovds:latest -f apps/backend/Dockerfile .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ovds:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  sbom-generation:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.14.3
        with:
          image: ovds:latest
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90
