name: Cloud Deploy & Rolling Migration

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  migrate-tenants:
    name: Rolling Tenant Migration
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Run rolling tenant migrations
        env:
          CONTROL_PLANE_DATABASE_URL: ${{ secrets.CONTROL_PLANE_DATABASE_URL }}
          TENANT_DATABASE_BASE_URL: ${{ secrets.TENANT_DATABASE_BASE_URL }}
          DATABASE_PROVIDER: postgresql
        run: |
          npx ts-node packages/core/src/tenant-migration-runner.ts \
            --mode=SHARED_SCHEMA

  deploy-api:
    name: Deploy Cloud API
    runs-on: ubuntu-latest
    needs: migrate-tenants
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build:backend

      - name: Build Docker image
        run: docker build -t ovds-cloud-api:${{ github.sha }} -f apps/backend/Dockerfile .

      - name: Push Docker image
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push ovds-cloud-api:${{ github.sha }}

      - name: Deploy to cloud
        run: echo "Deploy step here (ECS, Fly.io, Railway, etc.)"
        env:
          DEPLOYMENT_MODE: CLOUD_SAAS
          DATABASE_PROVIDER: postgresql

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [migrate-tenants, deploy-api]
    if: always()
    steps:
      - name: Notify success
        if: needs.migrate-tenants.result == 'success' && needs.deploy-api.result == 'success'
        run: echo "Deployment completed successfully"
      - name: Notify failure
        if: failure()
        run: echo "Deployment failed — check logs above"
