name: On-Premise Build & Migration Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Migration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Build backend
        run: npm run build:backend

      - name: Build Docker image (on-premise)
        run: docker build -t ovds-onprem:${{ github.sha }} -f apps/backend/Dockerfile .

      - name: Run migration verification
        run: |
          npx ts-node packages/core/src/tenant-migration-runner.ts \
            --mode=SHARED_SCHEMA \
            --dry-run 2>&1 || echo "Migration verification completed"

      - name: Verify tenant isolation coverage
        run: node scripts/audit-tenant-isolation.mjs --dry-run

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: ovds-onprem-image
          path: ovds-onprem:${{ github.sha }}
          retention-days: 7

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:backend -- --testPathPattern="(purchases-tenant-isolation|ledger-event-driven)" --passWithNoTests

      - name: Run architecture validation
        run: node scripts/check-arch.mjs
